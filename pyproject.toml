[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Code is wrapped at 100 columns by `ruff format`; the only longer lines are embedded SQL/HTML/CSS strings.
ignore = ["E501", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
